# Module Manager CI — runs on every push and pull request.
#
#   lint   gofmt, go vet, node --check on the frontend
#   test   go test ./... -race
#   vuln   govulncheck with the toolchain from go.mod (advisory, like ZFW: a stdlib
#          finding fixed in the next Go patch must not block a release tag)
#   build  build.sh for amd64 and arm64, the images as artifacts (arm64 is built,
#          not tested on hardware)
#
# go.mod replaces lintux-modkit with ../lintux-modkit, so every job checks out both
# repositories side by side (without it: "replacement directory ../lintux-modkit does
# not exist", measured 2026-10-23).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: zima-modmanager

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: zima-modmanager }
      - uses: actions/checkout@v7
        with: { repository: chicohaager/lintux-modkit, path: lintux-modkit }
      - uses: actions/setup-go@v7
        with: { go-version-file: zima-modmanager/go.mod, cache: false }
      - run: gofmt -l . | tee /tmp/fmt && [ ! -s /tmp/fmt ]
      - run: go vet ./...
      - run: node --check raw/usr/share/casaos/www/modules/modmanager/app.js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: zima-modmanager }
      - uses: actions/checkout@v7
        with: { repository: chicohaager/lintux-modkit, path: lintux-modkit }
      - uses: actions/setup-go@v7
        with: { go-version-file: zima-modmanager/go.mod, cache: false }
      - run: go test -race -count=1 ./...

  vuln:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { path: zima-modmanager }
      - uses: actions/checkout@v7
        with: { repository: chicohaager/lintux-modkit, path: lintux-modkit }
      - uses: actions/setup-go@v7
        with: { go-version-file: zima-modmanager/go.mod, cache: false }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with: { path: zima-modmanager }
      - uses: actions/checkout@v7
        with: { repository: chicohaager/lintux-modkit, path: lintux-modkit }
      - uses: actions/setup-go@v7
        with: { go-version-file: zima-modmanager/go.mod, cache: false }
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - run: sh build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: modmanager-${{ matrix.arch }}
          path: zima-modmanager/dist/modmanager-${{ matrix.arch }}.raw*
